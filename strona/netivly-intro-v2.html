<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netivly Intro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06091a; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  #wrap { position: relative; display: flex; align-items: center; justify-content: center; }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; }
  #logo { position: relative; z-index: 2; }
  #ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(79,158,248,0); width: 220px; height: 220px; z-index: 1; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="wrap">
  <div id="ripple"></div>
  <div id="logo"><canvas id="n" width="220" height="220"></canvas></div>
</div>
<script>
(function(){
  const bg=document.getElementById('bg'),bctx=bg.getContext('2d'),nc=document.getElementById('n'),ctx=nc.getContext('2d'),ripple=document.getElementById('ripple'),logoEl=document.getElementById('logo');
  function resizeBg(){bg.width=window.innerWidth;bg.height=window.innerHeight;drawGrid();}
  function drawGrid(){bctx.clearRect(0,0,bg.width,bg.height);bctx.strokeStyle='rgba(29,78,216,0.07)';bctx.lineWidth=1;const g=32;for(let x=0;x<bg.width;x+=g){bctx.beginPath();bctx.moveTo(x,0);bctx.lineTo(x,bg.height);bctx.stroke();}for(let y=0;y<bg.height;y+=g){bctx.beginPath();bctx.moveTo(0,y);bctx.lineTo(bg.width,y);bctx.stroke();}}
  window.addEventListener('resize',resizeBg);resizeBg();
  const S=220,sc=S/32,BLUE='#4f9ef8',DARK='#06091a';
  function drawN(p,g){ctx.clearRect(0,0,S,S);const r=7*sc;ctx.beginPath();ctx.roundRect(0,0,S,S,r);ctx.fillStyle=DARK;ctx.fill();ctx.beginPath();ctx.roundRect(sc,sc,S-2*sc,S-2*sc,r-sc);ctx.strokeStyle=`rgba(29,78,216,${0.5*p})`;ctx.lineWidth=1;ctx.stroke();if(g>0){ctx.save();ctx.shadowColor=`rgba(79,158,248,${g})`;ctx.shadowBlur=30*sc;ctx.fillStyle='rgba(0,0,0,0)';ctx.beginPath();ctx.roundRect(0,0,S,S,r);ctx.fill();ctx.restore();}[[5,5,6,22],[21,5,6,22],[11,11,5,6],[16,16,5,6]].forEach(([x,y,w,h],i)=>{const d=i*0.15,v=Math.max(0,Math.min(1,(p-d)/(1-d)));if(v<=0)return;ctx.fillStyle=BLUE;ctx.globalAlpha=v;ctx.fillRect(x*sc,y*sc,w*sc,h*sc);ctx.globalAlpha=1;});}
  let start=null;const TOTAL=1800;
  function rippleAnim(t){ripple.style.transform=`scale(${1+t*1.5})`;ripple.style.borderColor=`rgba(79,158,248,${(1-t)*0.6})`;}
  function animate(ts){if(!start)start=ts;const e=ts-start,p=Math.min(1,e/TOTAL),ep=p<0.5?2*p*p:-1+(4-2*p)*p;logoEl.style.transform=`scale(${0.3+0.7*ep})`;logoEl.style.opacity=ep;drawN(ep,p>0.8?Math.sin((p-0.8)/0.2*Math.PI)*0.8:0);if(p>0.85)rippleAnim((p-0.85)/0.15);if(p<1)requestAnimationFrame(animate);else{logoEl.style.transform='scale(1)';logoEl.style.opacity=1;ripple.style.borderColor='rgba(79,158,248,0)';setTimeout(restart,2000);}}
  function restart(){start=null;logoEl.style.opacity=0;logoEl.style.transform='scale(0.3)';ripple.style.transform='scale(1)';ripple.style.borderColor='rgba(79,158,248,0)';requestAnimationFrame(animate);}
  logoEl.style.opacity=0;logoEl.style.transform='scale(0.3)';drawN(0,0);requestAnimationFrame(animate);
})();
</script>
</body>
</html>
