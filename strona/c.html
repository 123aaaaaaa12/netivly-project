<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR 404 | Netivly</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Pobranie czcionek: Oswald (Nagłówki), Montserrat (UI), Fira Code (Terminal) -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Montserrat:wght@400;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- BAZA I TŁO --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #070a13; /* Najgłębsza, mroczna czerń z nutą granatu */
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Szum CRT (starego monitora) naklejony na całe tło */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.04;
            pointer-events: none;
            z-index: 10;
        }

        /* --- SKANER LASEROWY --- */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(59, 130, 246, 0.5); /* Niebieski laser Netivly */
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8), 0 0 30px rgba(59, 130, 246, 0.4);
            z-index: 11;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* --- KONTENER GŁÓWNY --- */
        .cyber-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        /* --- EFEKT GLITCH NA "404" --- */
        .glitch-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .glitch {
            font-family: 'Oswald', sans-serif;
            font-size: 150px;
            font-weight: 700;
            line-height: 1;
            margin: 0;
            position: relative;
            color: #ffffff;
            letter-spacing: 5px;
            /* Wyłączenie zaznaczania tekstu */
            user-select: none; 
        }

        /* Tworzenie warstw do rozszczepienia kolorów */
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #070a13;
        }

        /* Czerwone przesunięcie (Lewa) */
        .glitch::before {
            left: 3px;
            text-shadow: -2px 0 #ef4444; /* Czerwony błąd */
            clip-path: inset(20% 0 80% 0);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        /* Niebieskie przesunięcie (Prawa) */
        .glitch::after {
            left: -3px;
            text-shadow: -2px 0 #3b82f6; /* Niebieski Netivly */
            clip-path: inset(80% 0 5% 0);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 40% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        /* --- TERMINAL (KONSOLA) --- */
        .terminal {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b;
            border-left: 4px solid #ef4444; /* Czerwony pasek krytyczny */
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            font-family: 'Fira Code', monospace; /* Czcionka programistyczna */
            font-size: 14px;
            color: #10b981; /* Zielony terminalowy */
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 100px;
        }

        /* Miganie kursora */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #10b981;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Kolorowanie poszczególnych słów w terminalu */
        .error-txt { color: #ef4444; font-weight: bold; }
        .sys-txt { color: #3b82f6; }

        /* --- PRZYCISK AWARYJNY --- */
        .btn-override {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: transparent;
            color: #3b82f6;
            text-decoration: none;
            padding: 16px 40px;
            border: 2px solid #3b82f6;
            border-radius: 4px; /* Ostre krawędzie - styl tech */
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Efekt "napełniania" przycisku po najechaniu */
        .btn-override::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background-color: #3b82f6;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: -1;
        }

        .btn-override:hover {
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }

        .btn-override:hover::before {
            width: 100%;
        }

        /* Responsywność */
        @media (max-width: 480px) {
            .glitch { font-size: 100px; }
            .terminal { font-size: 12px; padding: 15px; }
            .btn-override { font-size: 16px; padding: 14px 30px; }
        }
    </style>
</head>

<body>

    <!-- Animowana linia skanera -->
    <div class="scanline"></div>

    <div class="cyber-container">
        
        <!-- Główny napis błędu z nałożonym efektem Glitch -->
        <div class="glitch-wrapper">
            <h1 class="glitch" data-text="404">404</h1>
        </div>

        <!-- Okienko Terminala -->
        <div class="terminal">
            <span id="typewriter"></span><span class="cursor"></span>
        </div>

        <!-- Przycisk powrotu -->
        <a href="/" class="btn-override">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 20px; height: 20px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347c-.75.412-1.667-.13-1.667-.986V5.653Z" />
            </svg>
            Inicjuj Powrót
        </a>
        
    </div>

    <!-- SKRYPT: Maszyna do pisania w terminalu -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const terminalText =[
                "> Połączenie przerwane...",
                "> Węzeł docelowy: <span class='error-txt'>OFFLINE</span>",
                "> Analiza przyczyny błędu...",
                "> <span class='sys-txt'>System:</span> Adres URL nie istnieje w strukturze Netivly.",
                "> Oczekuję na polecenie operatora_"
            ];
            
            const typeContainer = document.getElementById('typewriter');
            let lineIndex = 0;
            let charIndex = 0;
            let currentLine = "";
            let isTag = false;

            function typeWriter() {
                if (lineIndex < terminalText.length) {
                    currentLine = terminalText[lineIndex];
                    
                    // Obsługa tagów HTML wewnątrz tekstu maszyny do pisania
                    if (currentLine.charAt(charIndex) === '<') isTag = true;
                    if (currentLine.charAt(charIndex) === '>') isTag = false;

                    if (charIndex < currentLine.length) {
                        typeContainer.innerHTML = currentLine.substring(0, charIndex + 1) + "<br>";
                        charIndex++;
                        
                        // Jeśli jesteśmy wewnątrz tagu (np. <span>), wpisz go natychmiast bez opóźnienia
                        let speed = isTag ? 0 : Math.random() * 30 + 20;
                        setTimeout(typeWriter, speed);
                    } else {
                        // Przejście do następnej linijki
                        setTimeout(() => {
                            let textToKeep = "";
                            for(let i = 0; i <= lineIndex; i++) {
                                textToKeep += terminalText[i] + "<br>";
                            }
                            typeContainer.innerHTML = textToKeep;
                            lineIndex++;
                            charIndex = 0;
                            setTimeout(typeWriter, 400); // Pauza przed nową linią
                        }, 500);
                    }
                }
            }

            // Rozpocznij efekt po krótkim opóźnieniu
            setTimeout(typeWriter, 800);
        });
    </script>

</body>
</html>
