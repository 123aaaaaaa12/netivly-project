
<div style="background:#06091a;border-radius:16px;border:1px solid rgba(29,78,216,0.35);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:500px;width:100%;">
  <canvas id="a-bg" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
  <div style="position:relative;display:flex;align-items:center;justify-content:center;z-index:2;">
    <div id="a-rip" style="position:absolute;border-radius:50%;border:2px solid rgba(79,158,248,0);width:220px;height:220px;z-index:1;"></div>
    <div id="a-logo" style="position:relative;z-index:2;opacity:0;transform:scale(0.3);"><canvas id="a-n" width="220" height="220"></canvas></div>
  </div>
</div>
<script>
(function(){
  const wrap=document.querySelector('[style*="min-height:500px"]');
  const bg=document.getElementById('a-bg'),bctx=bg.getContext('2d'),nc=document.getElementById('a-n'),ctx=nc.getContext('2d'),rip=document.getElementById('a-rip'),logo=document.getElementById('a-logo');
  function grid(){bg.width=wrap.offsetWidth||800;bg.height=wrap.offsetHeight||500;bctx.clearRect(0,0,bg.width,bg.height);bctx.strokeStyle='rgba(29,78,216,0.07)';bctx.lineWidth=1;for(let x=0;x<bg.width;x+=32){bctx.beginPath();bctx.moveTo(x,0);bctx.lineTo(x,bg.height);bctx.stroke();}for(let y=0;y<bg.height;y+=32){bctx.beginPath();bctx.moveTo(0,y);bctx.lineTo(bg.width,y);bctx.stroke();}}
  grid();window.addEventListener('resize',grid);
  const S=220,sc=S/32;
  function drawN(p,g){ctx.clearRect(0,0,S,S);const r=7*sc;ctx.beginPath();ctx.roundRect(0,0,S,S,r);ctx.fillStyle='#06091a';ctx.fill();ctx.beginPath();ctx.roundRect(sc,sc,S-2*sc,S-2*sc,r-sc);ctx.strokeStyle=`rgba(29,78,216,${0.5*p})`;ctx.lineWidth=1;ctx.stroke();if(g>0){ctx.save();ctx.shadowColor=`rgba(79,158,248,${g})`;ctx.shadowBlur=20*sc;ctx.fillStyle='rgba(0,0,0,0)';ctx.beginPath();ctx.roundRect(0,0,S,S,r);ctx.fill();ctx.restore();}[[5,5,6,22],[21,5,6,22],[11,11,5,6],[16,16,5,6]].forEach(([x,y,w,h],i)=>{const d=i*0.15,v=Math.max(0,Math.min(1,(p-d)/(1-d)));if(v<=0)return;ctx.fillStyle='#4f9ef8';ctx.globalAlpha=v;ctx.fillRect(x*sc,y*sc,w*sc,h*sc);ctx.globalAlpha=1;});}
  let start=null;
  function tick(ts){if(!start)start=ts;const p=Math.min(1,(ts-start)/1800),ep=p<0.5?2*p*p:-1+(4-2*p)*p;logo.style.opacity=ep;logo.style.transform=`scale(${0.3+0.7*ep})`;drawN(ep,p>0.8?Math.sin((p-0.8)/0.2*Math.PI)*0.8:0);if(p>0.85){const t=(p-0.85)/0.15;rip.style.transform=`scale(${1+t*1.5})`;rip.style.borderColor=`rgba(79,158,248,${(1-t)*0.6})`;}if(p<1)requestAnimationFrame(tick);else{logo.style.opacity=1;logo.style.transform='scale(1)';rip.style.borderColor='rgba(79,158,248,0)';setTimeout(restart,2000);}}
  function restart(){start=null;logo.style.opacity=0;logo.style.transform='scale(0.3)';rip.style.transform='scale(1)';rip.style.borderColor='rgba(79,158,248,0)';requestAnimationFrame(tick);}
  drawN(0,0);requestAnimationFrame(tick);
})();
</script>

<div class="netivly-widget" style="width:160px;height:160px;background:#06091a;border:1px solid rgba(29,78,216,0.4);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">

  <div id="w-ripple" style="position:absolute;border-radius:50%;border:2px solid rgba(79,158,248,0);width:120px;height:120px;z-index:1;"></div>
  <div style="position:relative;z-index:2;"><canvas id="w-n" width="120" height="120"></canvas></div>
</div>
<script>
(function(){
  const bg=document.getElementById('w-bg'),bctx=bg.getContext('2d'),nc=document.getElementById('w-n'),ctx=nc.getContext('2d'),rip=document.getElementById('w-ripple');
  function grid(){bg.width=bg.offsetWidth;bg.height=bg.offsetHeight;bctx.clearRect(0,0,bg.width,bg.height);bctx.strokeStyle='rgba(29,78,216,0.08)';bctx.lineWidth=1;for(let x=0;x<bg.width;x+=16){bctx.beginPath();bctx.moveTo(x,0);bctx.lineTo(x,bg.height);bctx.stroke();}for(let y=0;y<bg.height;y+=16){bctx.beginPath();bctx.moveTo(0,y);bctx.lineTo(bg.width,y);bctx.stroke();}}
  grid();
  const S=120,sc=S/32;
  function drawN(p,g){ctx.clearRect(0,0,S,S);const r=7*sc;ctx.beginPath();ctx.roundRect(0,0,S,S,r);ctx.fillStyle='#06091a';ctx.fill();ctx.beginPath();ctx.roundRect(sc,sc,S-2*sc,S-2*sc,r-sc);ctx.strokeStyle=`rgba(29,78,216,${0.5*p})`;ctx.lineWidth=1;ctx.stroke();if(g>0){ctx.save();ctx.shadowColor=`rgba(79,158,248,${g})`;ctx.shadowBlur=20*sc;ctx.fillStyle='rgba(0,0,0,0)';ctx.beginPath();ctx.roundRect(0,0,S,S,r);ctx.fill();ctx.restore();}[[5,5,6,22],[21,5,6,22],[11,11,5,6],[16,16,5,6]].forEach(([x,y,w,h],i)=>{const d=i*0.15,v=Math.max(0,Math.min(1,(p-d)/(1-d)));if(v<=0)return;ctx.fillStyle='#4f9ef8';ctx.globalAlpha=v;ctx.fillRect(x*sc,y*sc,w*sc,h*sc);ctx.globalAlpha=1;});}
  let start=null;
  function tick(ts){if(!start)start=ts;const p=Math.min(1,(ts-start)/1800),ep=p<0.5?2*p*p:-1+(4-2*p)*p;drawN(ep,p>0.8?Math.sin((p-0.8)/0.2*Math.PI)*0.8:0);if(p>0.85){rip.style.transform=`scale(${1+(p-0.85)/0.15*1.5})`;rip.style.borderColor=`rgba(79,158,248,${(1-(p-0.85)/0.15)*0.6})`;}if(p<1)requestAnimationFrame(tick);else{drawN(1,0);rip.style.borderColor='rgba(79,158,248,0)';setTimeout(()=>{start=null;requestAnimationFrame(tick);},2000);}}
  requestAnimationFrame(tick);
})();
</script>
