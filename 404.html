<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — netivly</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    color: #ddd;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  /* ===== Domyślne zmienne motywu: VOID ===== */
  :root {
    --c1: #ffcf8c;
    --c2: #ff7a1a;
    --c3: #b33600;
    --bg: #07030100;
    --ring: #ff8c00;
    --text-glow-1: rgba(255, 120, 20, 0.55);
    --text-glow-2: rgba(255, 80, 0, 0.3);
    --text-accent: #ff6600;
    --msg-color: #e8c9a0;
    --msg2-color: #776;
    --back-border: #442200;
    --back-hover-border: #ff6600;
    --back-hover-color: #ff9933;
  }

  body.theme-halloween {
    --c1: #d6ffb0;
    --c2: #39ff14;
    --c3: #8800ff;
    --ring: #8800ff;
    --text-glow-1: rgba(136, 0, 255, 0.6);
    --text-glow-2: rgba(57, 255, 20, 0.35);
    --text-accent: #a64dff;
    --msg-color: #c7a8ff;
    --back-border: #3a0066;
    --back-hover-border: #8800ff;
    --back-hover-color: #c88cff;
  }

  body.theme-christmas {
    --c1: #ffffff;
    --c2: #aee4ff;
    --c3: #4ea8de;
    --ring: #4ea8de;
    --text-glow-1: rgba(78, 168, 222, 0.6);
    --text-glow-2: rgba(170, 220, 255, 0.35);
    --text-accent: #9fd8ff;
    --msg-color: #bfe3fa;
    --back-border: #15344d;
    --back-hover-border: #4ea8de;
    --back-hover-color: #cfeeff;
  }

  canvas { position: absolute; inset: 0; display: block; }

  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Kręcący się pierścień ładowania, jak przy aktualizacji aplikacji */
  .loader {
    position: absolute;
    width: 220px;
    height: 220px;
    z-index: 5;
    pointer-events: none;
  }
  .loader svg { width: 100%; height: 100%; }
  .loader circle {
    fill: none;
    stroke: var(--ring);
    stroke-width: 2.5;
    stroke-linecap: round;
    opacity: 0.85;
  }
  .loader .track {
    stroke: var(--ring);
    opacity: 0.12;
    stroke-width: 1.5;
  }
  .ring-a { stroke-dasharray: 70 400; animation: spin 2.6s linear infinite; transform-origin: 50% 50%; }
  .ring-b { stroke-dasharray: 40 400; animation: spin-rev 3.8s linear infinite; transform-origin: 50% 50%; opacity: 0.5; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }

  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }

  .code {
    font-size: clamp(54px, 13vw, 120px);
    font-weight: 900;
    letter-spacing: -4px;
    color: #f5f5f5;
    text-shadow: 0 0 34px var(--text-glow-1), 0 0 80px var(--text-glow-2);
    position: relative;
    display: inline-block;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.92; }
    50% { opacity: 1; text-shadow: 0 0 44px var(--text-glow-1), 0 0 100px var(--text-glow-2); }
  }
  .code::after {
    content: "404";
    position: absolute;
    left: 3px;
    top: 2px;
    color: var(--text-accent);
    z-index: -1;
    opacity: 0.5;
    animation: glitch 3.2s infinite;
  }
  @keyframes glitch {
    0%, 86%, 100% { transform: translate(0); opacity: .4; }
    89% { transform: translate(6px, -3px); opacity: .75; }
    91% { transform: translate(-5px, 3px); opacity: .1; }
    93% { transform: translate(3px, 2px); opacity: .55; }
  }

  .loading-line {
    margin-top: 170px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--msg-color);
  }
  .loading-line .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100% { content: ''; }
  }

  .sub {
    margin-top: 8px;
    font-size: 12px;
    color: var(--msg2-color);
  }

  .back {
    display: inline-block;
    margin-top: 30px;
    padding: 11px 22px;
    background: #090909;
    color: #ddd;
    border: 1px solid var(--back-border);
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
    transition: .2s;
  }
  .back:hover {
    background: #130f0a;
    border-color: var(--back-hover-border);
    color: var(--back-hover-color);
  }

  @media (prefers-reduced-motion: reduce) {
    .code, .ring-a, .ring-b, .loading-line .dots::after { animation: none !important; }
  }
</style>
</head>
<body>

<div class="scene">
  <canvas id="vortex"></canvas>

  <div class="loader">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="46"></circle>
      <circle class="ring-a" cx="50" cy="50" r="46"></circle>
      <circle class="ring-b" cx="50" cy="50" r="38"></circle>
    </svg>
  </div>

  <div class="content">
    <div class="code">404</div>
    <div class="loading-line" id="line">Szukam tej strony<span class="dots"></span></div>
    <div class="sub" id="sub"></div>
    <a class="back" href="/">← WRÓĆ NA GŁÓWNĄ</a>
  </div>
</div>

<script>
(function () {
  // ===== Ten sam system motywów co na stronie głównej =====
  function pickTheme() {
    const saved = localStorage.getItem('netivly_theme') || 'auto';
    if (saved === 'halloween' || saved === 'christmas') return saved;
    if (saved !== 'auto') return 'void';
    const now = new Date();
    const month = now.getMonth() + 1;
    const day = now.getDate();
    if (month === 10) return 'halloween';
    if ((month === 12 && day >= 15) || (month === 1 && day <= 6)) return 'christmas';
    return 'void';
  }

  const theme = pickTheme();
  if (theme === 'halloween') document.body.classList.add('theme-halloween');
  if (theme === 'christmas') document.body.classList.add('theme-christmas');

  const COPY = {
    void: { line: 'Szukam tej strony', sub: '(to się nigdy nie skończy, bo jej tu nie ma)', bg: '7,3,1' },
    halloween: { line: 'Warzę eliksir 404', sub: '(strona rozpuściła się w kotle)', bg: '8,2,14' },
    christmas: { line: 'Pakuję prezent 404', sub: '(tej strony nie było pod choinką)', bg: '2,7,13' }
  };
  document.getElementById('line').firstChild.textContent = COPY[theme].line;
  document.getElementById('sub').textContent = COPY[theme].sub;

  // ===== Wirująca otchłań cząsteczek (canvas) =====
  const canvas = document.getElementById('vortex');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const palette = getComputedStyle(document.body);
  const c1 = palette.getPropertyValue('--c1').trim() || '#ffcf8c';
  const c2 = palette.getPropertyValue('--c2').trim() || '#ff7a1a';
  const c3 = palette.getPropertyValue('--c3').trim() || '#b33600';
  const bgTriplet = COPY[theme].bg;
  const colors = [c1, c2, c3];

  let W, H, cx, cy;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    ctx.fillStyle = 'rgb(' + bgTriplet + ')';
    ctx.fillRect(0, 0, W, H);
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = window.innerWidth < 600 ? 90 : 170;
  const particles = [];
  for (let i = 0; i < COUNT; i++) {
    const maxR = Math.min(W, H) * (0.18 + Math.random() * 0.55);
    particles.push({
      angle: Math.random() * Math.PI * 2,
      radius: maxR,
      speed: (0.002 + Math.random() * 0.006) * (Math.random() < 0.5 ? 1 : -1),
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.004 + Math.random() * 0.01,
      size: 0.6 + Math.random() * 1.8,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  let running = !reduceMotion;
  let frame = null;

  function draw() {
    // Delikatny ślad zamiast pełnego czyszczenia — efekt "wirującej otchłani"
    ctx.fillStyle = 'rgba(' + bgTriplet + ',0.16)';
    ctx.fillRect(0, 0, W, H);

    // Pulsujący rdzeń w centrum
    const t = Date.now() / 1000;
    const coreR = 26 + Math.sin(t * 1.4) * 6;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 3);
    grad.addColorStop(0, c1);
    grad.addColorStop(0.35, c2);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 3, 0, Math.PI * 2);
    ctx.fill();

    for (const p of particles) {
      p.angle += p.speed;
      p.wobble += p.wobbleSpeed;
      const r = p.radius + Math.sin(p.wobble) * 10;
      const x = cx + Math.cos(p.angle) * r;
      const y = cy + Math.sin(p.angle) * r * 0.72; // lekka elipsa dla głębi
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.55 + Math.sin(p.wobble) * 0.25;
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (running) frame = requestAnimationFrame(draw);
  }

  if (reduceMotion) {
    // Jedna statyczna klatka zamiast nieskończonej animacji
    draw();
    running = false;
  } else {
    frame = requestAnimationFrame(draw);
  }

  // Pauza w nieaktywnej karcie — oszczędza CPU/baterię
  document.addEventListener('visibilitychange', () => {
    if (reduceMotion) return;
    if (document.hidden) {
      running = false;
      if (frame) cancelAnimationFrame(frame);
    } else if (!running) {
      running = true;
      frame = requestAnimationFrame(draw);
    }
  });
})();
</script>

</body>
</html>
