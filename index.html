<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="logo.png">
<title>Netivly – Anonymous Textboard</title>
<meta name="description" content="Netivly to anonimowy textboard. Twórz wątki, bierz udział w dyskusjach i dziel się przemyśleniami bez konieczności rejestracji." />
<link rel="canonical" href="https://netivly.pl/" />
<meta property="og:title" content="Netivly – Anonymous Textboard" />
<meta property="og:description" content="Anonimowe forum tekstowe. Twórz wątki i dyskutuj bez konta." />
<meta property="og:url" content="https://netivly.pl/" />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="particles"></div>

<div class="wrapper">

<header>
    <div class="logo" onclick="showHome()">netivly</div>
    <div class="subtitle">anonymous imageboard // text & media mode</div>
</header>

<div id="home">

    <div class="controls">
        <button onclick="showCreate()">
            + NOWY WĄTEK
        </button>

        <div class="status">
            NETIVLY // ONLINE
        </div>
    </div>

    <!-- ZAKŁADKI KATEGORII -->
    <div class="categories-bar">
        <button id="cat-btn-main" class="cat-btn active" onclick="switchCategory('main', this)">GŁÓWNA (MAIN)</button>
        <button id="cat-btn-netivly" class="cat-btn" onclick="switchCategory('netivly', this)">NETIVLY (ADMIN)</button>
        <button id="cat-btn-trash" class="cat-btn" onclick="switchCategory('trash', this)">KOSZ (TRASH)</button>
        <button id="cat-btn-private" class="cat-btn" onclick="switchCategory('private', this)">PRYWATNE (PRIVATE)</button>
    </div>

    <div id="createBox">
        <input id="threadTitle" type="text" maxlength="100" placeholder="Temat wątku...">
        
        <select id="threadCategory" onchange="togglePasswordInput()">
            <option value="main">Główna (Main)</option>
            <option value="trash">Kosz (Trash)</option>
            <option value="private">Prywatna (Private - chroniona hasłem)</option>
            <option value="netivly" id="netivlyAdminOption" disabled>Netivly (Tylko Admin)</option>
        </select>

        <input id="threadPassword" type="password" placeholder="Wprowadź hasło do wątku prywatnego..." style="display: none;">

        <textarea id="threadContent" maxlength="5000" placeholder="Treść pierwszego posta..."></textarea>

        <div class="file-input-wrapper">
            <input id="threadImage" type="file" accept="image/*">
        </div>

        <button id="btnCreateThread" onclick="createThread()">UTWÓRZ WĄTEK</button>
        <button onclick="hideCreate()">ANULUJ</button>
    </div>

    <div id="threads">
        <div class="empty">ŁADOWANIE...</div>
    </div>

</div>

<div id="board">
    <button class="back" onclick="goBackHome()">← WRÓĆ</button>

    <div id="boardContent"></div>

    <div class="reply">
        <textarea id="replyContent" maxlength="5000" placeholder="Napisz anonimowo... (kliknij w post, aby dodać cytat)"></textarea>
        <div class="file-input-wrapper">
            <input id="replyImage" type="file" accept="image/*">
        </div>
        <button id="btnSendReply" onclick="sendPost()">WYŚLIJ ODPOWIEDŹ</button>
    </div>
</div>

<footer>
    NETIVLY // NOTHING REMAINS
</footer>

</div>

<script src="app.js"></script>
</body>
</html>
