<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="logo.png">
<title>Netivly – Anonymous Textboard</title>
<meta name="description" content="Netivly to anonimowy textboard. Twórz wątki, bierz udział w dyskusjach i dziel się przemyśleniami bez konieczności rejestracji." />
<link rel="canonical" href="https://netivly.pl/" />
<meta property="og:title" content="Netivly – Anonymous Textboard" />
<meta property="og:description" content="Anonimowe forum tekstowe. Twórz wątki i dyskutuj bez konta." />
<meta property="og:url" content="https://netivly.pl/" />
<meta property="og:type" content="website" />

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000;
    color: #ddd;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   TŁO — ROZPAD MATERII
========================= */

#particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #777;
    opacity: 0;
    animation: drift linear infinite;
}

@keyframes drift {
    0% { transform: translate(0, 0) scale(1); opacity: 0; }
    15% { opacity: .45; }
    70% { opacity: .18; }
    100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
}

/* =========================
   GŁÓWNY INTERFEJS
========================= */

.wrapper {
    position: relative;
    z-index: 2;
    width: min(1100px, 94%);
    margin: auto;
}

/* =========================
   HEADER
========================= */

header {
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-bottom: 1px solid #181818;
    position: relative;
}

.logo {
    font-size: clamp(42px, 8vw, 82px);
    font-weight: 900;
    letter-spacing: -5px;
    color: #f2f2f2;
    text-transform: lowercase;
    position: relative;
    display: inline-block;
    width: max-content;
    cursor: pointer;
}

.logo::after {
    content: "netivly";
    position: absolute;
    left: 4px;
    top: 3px;
    color: #333;
    z-index: -1;
    animation: glitch 4s infinite;
}

@keyframes glitch {
    0%, 88%, 100% { transform: translate(0); opacity: .3; }
    90% { transform: translate(8px, -2px); opacity: .7; }
    92% { transform: translate(-6px, 2px); opacity: .1; }
}

.subtitle {
    color: #555;
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* =========================
   PRZYCISKI I FILTRY SEKCJI
========================= */

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 0 15px 0;
    gap: 15px;
    flex-wrap: wrap;
}

.categories-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid #1a1a1a;
    padding-bottom: 10px;
    flex-wrap: wrap;
}

.cat-btn {
    background: #050505;
    color: #888;
    border: 1px solid #1a1a1a;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: .2s;
}

.cat-btn:hover, .cat-btn.active {
    background: #151515;
    color: #fff;
    border-color: #444;
}

button {
    background: #090909;
    color: #ddd;
    border: 1px solid #252525;
    padding: 11px 18px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    background: #151515;
    border-color: #555;
    color: white;
}

.status {
    color: #444;
    font-size: 12px;
}

/* =========================
   NOWY WĄTEK
========================= */

#createBox {
    display: none;
    background: #050505;
    border: 1px solid #202020;
    padding: 20px;
    margin-bottom: 25px;
}

#createBox input,
#createBox select,
#createBox textarea {
    width: 100%;
    background: #000;
    color: #ddd;
    border: 1px solid #222;
    padding: 12px;
    margin-bottom: 10px;
    outline: none;
}

#createBox input:focus,
#createBox select:focus,
#createBox textarea:focus {
    border-color: #555;
}

#createBox textarea {
    min-height: 100px;
    resize: vertical;
}

/* =========================
   WĄTKI
========================= */

#threads {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.thread {
    position: relative;
    background: rgba(7, 7, 7, .88);
    border: 1px solid #151515;
    padding: 20px;
    cursor: pointer;
    overflow: hidden;
    transition: border .3s, transform .3s, background .3s;
}

.thread.pinned-thread {
    border-color: #443810;
    background: #0e0c05;
}

.thread:hover {
    border-color: #383838;
    background: #0b0b0b;
    transform: translateX(4px);
}

.thread::before,
.thread::after {
    content: "";
    position: absolute;
    pointer-events: none;
}

.thread::before {
    width: 70px;
    height: 70px;
    right: -20px;
    top: -20px;
    background: radial-gradient(circle, #777 1px, transparent 1px);
    background-size: 8px 8px;
    opacity: .08;
    mask-image: linear-gradient(135deg, black, transparent);
}

.thread::after {
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.025), transparent);
    transform: translateX(-100%);
    animation: scan 6s infinite;
}

@keyframes scan {
    0%, 70% { transform: translateX(-100%); }
    90%, 100% { transform: translateX(100%); }
}

.thread-title {
    font-size: 19px;
    color: #eee;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.thread-meta {
    color: #555;
    font-size: 12px;
    display: flex;
    gap: 15px;
    align-items: center;
}

.badge {
    text-transform: uppercase;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 2px;
    background: #111;
    border: 1px solid #333;
}

.badge-pinned { border-color: #aa8800; color: #ffd700; font-weight: bold; }
.badge-netivly { border-color: #38a; color: #8cf; }
.badge-private { border-color: #833; color: #f88; }
.badge-trash { border-color: #555; color: #888; }
.badge-main { border-color: #383; color: #8f8; }

.posts-count {
    color: #777;
    font-size: 11px;
    border: 1px solid #222;
    padding: 2px 6px;
    background: #000;
}

.empty {
    padding: 80px 20px;
    text-align: center;
    color: #333;
    border: 1px dashed #151515;
}

/* =========================
   WĄTEK & POSTY
========================= */

#board {
    display: none;
}

.back {
    margin-bottom: 20px;
}

.post {
    position: relative;
    background: #070707;
    border-left: 2px solid #202020;
    padding: 18px;
    margin-bottom: 10px;
    overflow: hidden;
}

.post:hover {
    border-left-color: #555;
}

.post-head {
    color: #555;
    font-size: 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.post-id-btn {
    color: #888;
    cursor: pointer;
    font-weight: bold;
    transition: color 0.2s;
}

.post-id-btn:hover {
    color: #fff;
    text-decoration: underline;
}

.post-content {
    white-space: pre-wrap;
    color: #ccc;
    line-height: 1.6;
}

.post-image-container {
    margin-top: 12px;
}

.post-image {
    max-width: 320px;
    max-height: 320px;
    border-radius: 4px;
    border: 1px solid #222;
    display: block;
    object-fit: cover;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.post-image:hover {
    transform: scale(1.01);
    border-color: #555;
}

.reply {
    margin-top: 25px;
    background: #050505;
    border: 1px solid #171717;
    padding: 20px;
}

.reply textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    background: #000;
    border: 1px solid #222;
    color: #ddd;
    padding: 13px;
    outline: none;
    margin-bottom: 10px;
}

.file-input-wrapper {
    margin-bottom: 12px;
}

.file-input-wrapper input[type="file"] {
    font-size: 12px;
    color: #888;
}

/* =========================
   POWIADOMIENIA O NOWYCH POSTACH
========================= */

#newPostsBanner {
    display: none;
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: #6f6;
    border: 1px solid #383;
    padding: 12px 24px;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

#newPostsBanner:hover {
    background: #1a1a1a;
    border-color: #8f8;
}

footer {
    color: #292929;
    text-align: center;
    padding: 60px 0 30px;
    font-size: 11px;
    letter-spacing: 2px;
}

@media (max-width: 600px) {
    header { min-height: 140px; }
    .logo { letter-spacing: -3px; }
    .controls { align-items: flex-start; flex-direction: column; }
    .thread { padding: 16px; }
    .post-image { max-width: 100%; }
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="wrapper">

<header>
    <div class="logo" onclick="showHome()">netivly</div>
    <div class="subtitle">anonymous imageboard // text & media mode</div>
</header>

<div id="home">

    <div class="controls">
        <button onclick="showCreate()">
            + NOWY WĄTEK
        </button>

        <div class="status">
            NETIVLY // ONLINE
        </div>
    </div>

    <!-- ZAKŁADKI KATEGORII -->
    <div class="categories-bar">
        <button id="cat-btn-main" class="cat-btn active" onclick="switchCategory('main', this)">GŁÓWNA (MAIN)</button>
        <button id="cat-btn-netivly" class="cat-btn" onclick="switchCategory('netivly', this)">NETIVLY (ADMIN)</button>
        <button id="cat-btn-trash" class="cat-btn" onclick="switchCategory('trash', this)">KOSZ (TRASH)</button>
        <button id="cat-btn-private" class="cat-btn" onclick="switchCategory('private', this)">PRYWATNE (PRIVATE)</button>
    </div>

    <div id="createBox">
        <input id="threadTitle" type="text" maxlength="100" placeholder="Temat wątku...">
        
        <select id="threadCategory" onchange="togglePasswordInput()">
            <option value="main">Główna (Main)</option>
            <option value="trash">Kosz (Trash)</option>
            <option value="private">Prywatna (Private - chroniona hasłem)</option>
            <option value="netivly" id="netivlyAdminOption" disabled>Netivly (Tylko Admin)</option>
        </select>

        <input id="threadPassword" type="password" placeholder="Wprowadź hasło do wątku prywatnego..." style="display: none;">

        <textarea id="threadContent" maxlength="5000" placeholder="Treść pierwszego posta..."></textarea>

        <div class="file-input-wrapper">
            <input id="threadImage" type="file" accept="image/*">
        </div>

        <button onclick="createThread()">UTWÓRZ WĄTEK</button>
        <button onclick="hideCreate()">ANULUJ</button>
    </div>

    <div id="threads">
        <div class="empty">ŁADOWANIE...</div>
    </div>

</div>

<div id="board">
    <button class="back" onclick="goBackHome()">← WRÓĆ</button>

    <div id="boardContent"></div>

    <div class="reply">
        <textarea id="replyContent" maxlength="5000" placeholder="Napisz anonimowo... (kliknij w post, aby dodać cytat)"></textarea>
        <div class="file-input-wrapper">
            <input id="replyImage" type="file" accept="image/*">
        </div>
        <button onclick="sendPost()">WYŚLIJ ODPOWIEDŹ</button>
    </div>
</div>

<div id="newPostsBanner" onclick="refreshCurrentThread()">
    ⚡ NOWE ODPOWIEDZI W WĄTKU! KLIKNIJ, ABY ODŚWIEŻYĆ
</div>

<footer>
    NETIVLY // NOTHING REMAINS
</footer>

</div>

<script>
const API = "https://netivly-api.cosielampisz7.workers.dev";
const PUBLIC_R2_URL = "https://pub-7a09632add214d85b55e3b4f71c39208.r2.dev";

let currentThread = null;
let currentCategory = 'main';
let currentThreadPassword = '';
let adminToken = localStorage.getItem('adminToken') || '';
let loadedPostCount = 0;

if (adminToken) {
    const opt = document.getElementById("netivlyAdminOption");
    if (opt) {
        opt.disabled = false;
        opt.innerText = "Netivly (Tryb Admina)";
    }
}

/* =========================
   HISTORIA I WSTECZ
========================= */
window.addEventListener('popstate', (event) => {
    if (event.state && event.state.threadId) {
        openThread(event.state.threadId, false);
    } else {
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('cat') || 'main';
        const targetBtn = document.getElementById(`cat-btn-${cat}`);
        switchCategory(cat, targetBtn, false);
        showHomeUI(false);
    }
});

function goBackHome() {
    if (window.history.state && window.history.state.threadId) {
        window.history.back();
    } else {
        showHome();
    }
}

function formatDate(dateStr) {
    if (!dateStr) return "";
    let str = dateStr.replace(" ", "T");
    if (!str.endsWith("Z") && !str.includes("+")) str += "Z";
    const date = new Date(str);
    if (isNaN(date.getTime())) return dateStr;
    return date.toLocaleString();
}

/* =========================
   CZĄSTECZKI
========================= */
const particles = document.getElementById("particles");
for (let i = 0; i < 120; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.top = Math.random() * 100 + "%";
    p.style.setProperty("--x", (Math.random() * 180 - 90) + "px");
    p.style.setProperty("--y", (Math.random() * 180 - 90) + "px");
    p.style.animationDuration = (4 + Math.random() * 8) + "s";
    p.style.animationDelay = (Math.random() * 8) + "s";
    particles.appendChild(p);
}

/* =========================
   KOMPRESYJNA KONTROLA ZDJĘĆ (.WEBP)
========================= */
async function compressImage(file) {
    if (!file) return null;
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxDim = 1000;

                if (width > maxDim || height > maxDim) {
                    if (width > height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob((blob) => {
                    if (!blob) {
                        reject(new Error("Błąd kompresji pliku."));
                        return;
                    }
                    if (blob.size > 2 * 1024 * 1024) {
                        reject(new Error("Plik po kompresji nadal przekracza 2MB. Wybierz mniejsze zdjęcie."));
                        return;
                    }
                    const compressedFile = new File([blob], "upload.webp", { type: "image/webp" });
                    resolve(compressedFile);
                }, "image/webp", 0.7);
            };
            img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
    });
}

/* =========================
   SEKCJE / KATEGORIE
========================= */
function switchCategory(cat, btn, updateUrl = true) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    
    if (!btn) {
        btn = document.getElementById(`cat-btn-${cat}`);
    }
    if (btn) btn.classList.add('active');

    if (updateUrl && !currentThread) {
        const newUrl = cat === 'main' ? window.location.pathname : `?cat=${cat}`;
        window.history.pushState({ category: cat }, "", newUrl);
    }

    loadThreads();
}

/* =========================
   LISTA WĄTKÓW (Z LICZNIKIEM ODPOWIEDZI)
========================= */
async function loadThreads() {
    const container = document.getElementById("threads");

    try {
        const response = await fetch(`${API}/api/threads?category=${currentCategory}`);
        const threads = await response.json();

        if (!threads || !threads.length) {
            container.innerHTML = `
                <div class="empty">
                    BRAK WĄTKÓW W TEJ KATEGORII<br><br>
                    <span style="color:#222">cisza w próżni</span>
                </div>
            `;
            return;
        }

        threads.sort((a, b) => (b.is_pinned || 0) - (a.is_pinned || 0));

        container.innerHTML = "";

        threads.forEach(thread => {
            const div = document.createElement("div");
            div.className = `thread ${thread.is_pinned ? 'pinned-thread' : ''}`;

            const pinBadge = thread.is_pinned ? `<span class="badge badge-pinned">📌 PINNED</span>` : '';
            const catBadge = thread.category ? `<span class="badge badge-${thread.category}">${thread.category}</span>` : '';

            div.innerHTML = `
                <div class="thread-title">
                    ${pinBadge} #${thread.id} ${escapeHTML(thread.title)}
                </div>
                <div class="thread-meta">
                    <span>${formatDate(thread.created_at)}</span>
                    ${catBadge}
                </div>
            `;

            div.onclick = () => openThread(thread.id, true);
            container.appendChild(div);
        });

    } catch (error) {
        container.innerHTML = `<div class="empty">BŁĄD POŁĄCZENIA Z NETIVLY API</div>`;
        console.error(error);
    }
}

/* =========================
   TWORZENIE WĄTKU
========================= */
function showCreate() { document.getElementById("createBox").style.display = "block"; }
function hideCreate() { document.getElementById("createBox").style.display = "none"; }

function togglePasswordInput() {
    const cat = document.getElementById("threadCategory").value;
    document.getElementById("threadPassword").style.display = (cat === 'private') ? 'block' : 'none';
}

async function createThread() {
    const title = document.getElementById("threadTitle").value.trim();
    const content = document.getElementById("threadContent").value.trim();
    const category = document.getElementById("threadCategory").value;
    const password = document.getElementById("threadPassword").value.trim();
    const imageFileInput = document.getElementById("threadImage").files[0];

    if (!title || !content) {
        alert("Podaj temat i treść posta.");
        return;
    }

    if (category === 'private' && !password) {
        alert("Wprowadź hasło dla wątku prywatnego.");
        return;
    }

    try {
        let compressedFile = null;
        if (imageFileInput) {
            compressedFile = await compressImage(imageFileInput);
        }

        const headers = { "Content-Type": "application/json" };
        if (adminToken) {
            headers["Authorization"] = `Bearer ${adminToken}`;
        }

        const response = await fetch(API + "/api/thread", {
            method: "POST",
            headers,
            body: JSON.stringify({ title, category, password })
        });

        const result = await response.json();

        if (!result.success) {
            alert(result.error || "Nie udało się utworzyć wątku.");
            return;
        }

        /* Pierwszy post z obsługą pliku (FormData) */
        const formData = new FormData();
        formData.append("thread_id", result.thread_id);
        formData.append("content", content);
        if (compressedFile) {
            formData.append("image", compressedFile);
        }

        const postHeaders = {};
        if (password) postHeaders["X-Thread-Password"] = password;

        await fetch(API + "/api/post", {
            method: "POST",
            headers: postHeaders,
            body: formData
        });

        hideCreate();
        document.getElementById("threadTitle").value = "";
        document.getElementById("threadContent").value = "";
        document.getElementById("threadPassword").value = "";
        document.getElementById("threadImage").value = "";
        
        switchCategory(category);

    } catch (error) {
        alert(error.message || "Nie można połączyć się z API.");
        console.error(error);
    }
}

/* =========================
   OTWIERANIE WĄTKU I CYTOWANIE
========================= */
async function openThread(id, pushHistory = true) {
    try {
        const headers = {};
        if (currentThreadPassword) {
            headers["X-Thread-Password"] = currentThreadPassword;
        }
        if (adminToken) {
            headers["Authorization"] = `Bearer ${adminToken}`;
        }

        let response = await fetch(`${API}/api/thread/${id}`, { headers });

        if (response.status === 401) {
            const pass = prompt("Wątek jest prywatny. Podaj hasło dostępu:");
            if (!pass) return;

            currentThreadPassword = pass;
            headers["X-Thread-Password"] = pass;
            response = await fetch(`${API}/api/thread/${id}`, { headers });

            if (response.status === 401) {
                alert("Niepoprawne hasło!");
                currentThreadPassword = '';
                return;
            }
        }

        const data = await response.json();
        if (data.error) {
            alert(data.error);
            return;
        }

        currentThread = id;
        loadedPostCount = data.posts ? data.posts.length : 0;
        document.getElementById("newPostsBanner").style.display = "none";

        if (pushHistory) {
            window.history.pushState({ threadId: id }, "", `?thread=${id}`);
        }

        document.getElementById("home").style.display = "none";
        document.getElementById("board").style.display = "block";

        const board = document.getElementById("boardContent");
        board.innerHTML = `
            <h2 style="color:#eee; font-weight:normal; margin-bottom:25px;">
                ${data.thread.is_pinned ? '📌 ' : ''}#${data.thread.id} ${escapeHTML(data.thread.title)}
            </h2>
        `;

        data.posts.forEach(post => {
            const div = document.createElement("div");
            div.className = "post";

            let imageHtml = '';
            if (post.image_key) {
                const imgUrl = `${PUBLIC_R2_URL}/${post.image_key}`;
                imageHtml = `
                    <div class="post-image-container">
                        <a href="${imgUrl}" target="_blank">
                            <img src="${imgUrl}" class="post-image" alt="Zdjęcie" loading="lazy" />
                        </a>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="post-head">
                    <span>ANONIM // <span class="post-id-btn" onclick="quotePost(${post.id})">#${post.id}</span></span>
                    <span>${formatDate(post.created_at)}</span>
                </div>
                <div class="post-content" onclick="quotePost(${post.id})">${escapeHTML(post.content)}</div>
                ${imageHtml}
            `;
            board.appendChild(div);
        });

    } catch (error) {
        console.error(error);
        alert("Nie udało się otworzyć wątku.");
    }
}

/* Cytowanie wpisów po kliknięciu */
function quotePost(postId) {
    const textarea = document.getElementById("replyContent");
    const selection = window.getSelection().toString().trim();

    let quoteText = `>>${postId}\n`;
    if (selection) {
        quoteText += selection.split('\n').map(line => `> ${line}`).join('\n') + '\n';
    }

    textarea.value += quoteText;
    textarea.focus();
    textarea.scrollIntoView({ behavior: 'smooth' });
}

/* =========================
   ODPOWIEDŹ
========================= */
async function sendPost() {
    const textarea = document.getElementById("replyContent");
    const imageInput = document.getElementById("replyImage");
    const content = textarea.value.trim();
    const file = imageInput.files[0];

    if (!content && !file) {
        alert("Treść posta lub zdjęcie jest wymagane.");
        return;
    }

    try {
        let compressedFile = null;
        if (file) {
            compressedFile = await compressImage(file);
        }

        const formData = new FormData();
        formData.append("thread_id", currentThread);
        formData.append("content", content || "(brak treści)");
        if (compressedFile) {
            formData.append("image", compressedFile);
        }

        const headers = {};
        if (currentThreadPassword) {
            headers["X-Thread-Password"] = currentThreadPassword;
        }

        const response = await fetch(API + "/api/post", {
            method: "POST",
            headers,
            body: formData
        });

        const result = await response.json();

        if (!result.success) {
            alert(result.error || "Błąd wysyłania.");
            return;
        }

        textarea.value = "";
        imageInput.value = "";
        openThread(currentThread, false);

    } catch (error) {
        alert(error.message || "Błąd połączenia z API.");
    }
}

function refreshCurrentThread() {
    if (currentThread) {
        openThread(currentThread, false);
    }
}

function showHome() {
    const newUrl = currentCategory === 'main' ? window.location.pathname : `?cat=${currentCategory}`;
    window.history.pushState(null, "", newUrl);
    showHomeUI();
}

function showHomeUI(reload = true) {
    currentThread = null;
    currentThreadPassword = '';
    document.getElementById("board").style.display = "none";
    document.getElementById("home").style.display = "block";
    document.getElementById("newPostsBanner").style.display = "none";
    if (reload) loadThreads();
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

/* =========================
   START & REFRESH (DETEKCJA NOWYCH POSTÓW)
========================= */
const urlParams = new URLSearchParams(window.location.search);
const initialThreadId = urlParams.get('thread');
const initialCategory = urlParams.get('cat');

if (initialThreadId) {
    openThread(initialThreadId, false);
} else {
    if (initialCategory && ['main', 'netivly', 'trash', 'private'].includes(initialCategory)) {
        currentCategory = initialCategory;
        const btn = document.getElementById(`cat-btn-${initialCategory}`);
        if (btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    }
    loadThreads();
}

/* Polling sprawdzający czy są nowe posty w tle */
setInterval(async () => {
    if (currentThread) {
        try {
            const headers = {};
            if (currentThreadPassword) headers["X-Thread-Password"] = currentThreadPassword;
            if (adminToken) headers["Authorization"] = `Bearer ${adminToken}`;

            const response = await fetch(`${API}/api/thread/${currentThread}`, { headers });
            if (response.ok) {
                const data = await response.json();
                if (data.posts && data.posts.length > loadedPostCount) {
                    document.getElementById("newPostsBanner").style.display = "block";
                }
            }
        } catch (e) {
            // Cichy błąd odświeżania w tle
        }
    } else {
        const createBox = document.getElementById("createBox");
        if (!createBox || createBox.style.display !== "block") {
            loadThreads();
        }
    }
}, 15000);
</script>
