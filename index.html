<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="logo.png">
<title>Netivly Chan</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000;
    color: #ddd;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   TŁO — ROZPAD MATERII
========================= */

#particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #777;
    opacity: 0;
    animation: drift linear infinite;
}

@keyframes drift {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 0;
    }

    15% {
        opacity: .45;
    }

    70% {
        opacity: .18;
    }

    100% {
        transform: translate(
            var(--x),
            var(--y)
        ) scale(0);
        opacity: 0;
    }
}

/* =========================
   GŁÓWNY INTERFEJS
========================= */

.wrapper {
    position: relative;
    z-index: 2;
    width: min(1100px, 94%);
    margin: auto;
}

/* =========================
   HEADER
========================= */

header {
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-bottom: 1px solid #181818;
    position: relative;
}

.logo {
    font-size: clamp(42px, 8vw, 82px);
    font-weight: 900;
    letter-spacing: -5px;
    color: #f2f2f2;
    text-transform: lowercase;
    position: relative;
    display: inline-block;
    width: max-content;
}

.logo::after {
    content: "netivly";
    position: absolute;
    left: 4px;
    top: 3px;
    color: #333;
    z-index: -1;
    animation: glitch 4s infinite;
}

@keyframes glitch {
    0%, 88%, 100% {
        transform: translate(0);
        opacity: .3;
    }

    90% {
        transform: translate(8px, -2px);
        opacity: .7;
    }

    92% {
        transform: translate(-6px, 2px);
        opacity: .1;
    }
}

.subtitle {
    color: #555;
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* =========================
   PRZYCISKI
========================= */

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 0;
    gap: 15px;
}

button {
    background: #090909;
    color: #ddd;
    border: 1px solid #252525;
    padding: 11px 18px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    background: #151515;
    border-color: #555;
    color: white;
}

.status {
    color: #444;
    font-size: 12px;
}

/* =========================
   NOWY WĄTEK
========================= */

#createBox {
    display: none;
    background: #050505;
    border: 1px solid #202020;
    padding: 20px;
    margin-bottom: 25px;
}

#createBox input,
#createBox textarea {
    width: 100%;
    background: #000;
    color: #ddd;
    border: 1px solid #222;
    padding: 12px;
    margin-bottom: 10px;
    outline: none;
}

#createBox input:focus,
#createBox textarea:focus {
    border-color: #555;
}

#createBox textarea {
    min-height: 100px;
    resize: vertical;
}

/* =========================
   WĄTKI
========================= */

#threads {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.thread {
    position: relative;
    background: rgba(7, 7, 7, .88);
    border: 1px solid #151515;
    padding: 20px;
    cursor: pointer;
    overflow: hidden;
    transition:
        border .3s,
        transform .3s,
        background .3s;
}

.thread:hover {
    border-color: #383838;
    background: #0b0b0b;
    transform: translateX(4px);
}

/* rozpadające się drobinki przy wątku */

.thread::before,
.thread::after {
    content: "";
    position: absolute;
    pointer-events: none;
}

.thread::before {
    width: 70px;
    height: 70px;
    right: -20px;
    top: -20px;
    background:
        radial-gradient(circle, #777 1px, transparent 1px);
    background-size: 8px 8px;
    opacity: .08;
    mask-image: linear-gradient(135deg, black, transparent);
}

.thread::after {
    inset: 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.025),
        transparent
    );
    transform: translateX(-100%);
    animation: scan 6s infinite;
}

@keyframes scan {
    0%, 70% {
        transform: translateX(-100%);
    }

    90%, 100% {
        transform: translateX(100%);
    }
}

.thread-title {
    font-size: 19px;
    color: #eee;
    margin-bottom: 8px;
}

.thread-meta {
    color: #444;
    font-size: 12px;
}

.empty {
    padding: 80px 20px;
    text-align: center;
    color: #333;
    border: 1px dashed #151515;
}

/* =========================
   WĄTEK
========================= */

#board {
    display: none;
}

.back {
    margin-bottom: 20px;
}

.post {
    position: relative;
    background: #070707;
    border-left: 2px solid #202020;
    padding: 18px;
    margin-bottom: 10px;
    overflow: hidden;
}

.post:hover {
    border-left-color: #555;
}

.post-head {
    color: #555;
    font-size: 12px;
    margin-bottom: 12px;
}

.post-content {
    white-space: pre-wrap;
    color: #ccc;
    line-height: 1.6;
}

.reply {
    margin-top: 25px;
    background: #050505;
    border: 1px solid #171717;
    padding: 20px;
}

.reply textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    background: #000;
    border: 1px solid #222;
    color: #ddd;
    padding: 13px;
    outline: none;
    margin-bottom: 10px;
}

/* =========================
   FOOTER
========================= */

footer {
    color: #292929;
    text-align: center;
    padding: 60px 0 30px;
    font-size: 11px;
    letter-spacing: 2px;
}

/* =========================
   EFEKT ROZPADU
========================= */

.dissolve {
    animation: dissolve .8s forwards;
}

@keyframes dissolve {
    0% {
        opacity: 1;
        filter: blur(0);
        transform: translateX(0);
    }

    50% {
        opacity: .6;
        filter: blur(1px);
        transform: translateX(4px);
    }

    100% {
        opacity: 0;
        filter: blur(6px);
        transform: translateX(25px);
    }
}

@media (max-width: 600px) {
    header {
        min-height: 140px;
    }

    .logo {
        letter-spacing: -3px;
    }

    .controls {
        align-items: flex-start;
        flex-direction: column;
    }

    .thread {
        padding: 16px;
    }
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="wrapper">

<header>
    <div class="logo">netivly</div>
    <div class="subtitle">anonymous imageboard // text mode</div>
</header>

<div id="home">

    <div class="controls">
        <button onclick="showCreate()">
            + NOWY WĄTEK
        </button>

        <div class="status">
            NETIVLY // ONLINE
        </div>
    </div>

    <div id="createBox">

        <input
            id="threadTitle"
            type="text"
            maxlength="100"
            placeholder="Temat wątku..."
        >

        <textarea
            id="threadContent"
            maxlength="5000"
            placeholder="Treść pierwszego posta..."
        ></textarea>

        <button onclick="createThread()">
            UTWÓRZ WĄTEK
        </button>

        <button onclick="hideCreate()">
            ANULUJ
        </button>

    </div>

    <div id="threads">
        <div class="empty">
            ŁADOWANIE...
        </div>
    </div>

</div>


<div id="board">

    <button class="back" onclick="showHome()">
        ← WRÓĆ
    </button>

    <div id="boardContent"></div>

    <div class="reply">

        <textarea
            id="replyContent"
            maxlength="5000"
            placeholder="Napisz anonimowo..."
        ></textarea>

        <button onclick="sendPost()">
            WYŚLIJ
        </button>

    </div>

</div>


<footer>
    NETIVLY // NOTHING REMAINS
</footer>

</div>


<script>

/* =========================
   API
========================= */

const API =
    "https://netivly-api.cosielampisz7.workers.dev";


let currentThread = null;


/* =========================
   FORMATOWANIE DATY (STREFA LOKALNA)
========================= */

function formatDate(dateStr) {
    if (!dateStr) return "";
    let str = dateStr.replace(" ", "T");
    if (!str.endsWith("Z") && !str.includes("+")) {
        str += "Z";
    }
    const date = new Date(str);
    if (isNaN(date.getTime())) return dateStr;
    
    return date.toLocaleString();
}


/* =========================
   CZĄSTECZKI
========================= */

const particles =
    document.getElementById("particles");

for (let i = 0; i < 120; i++) {

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left =
        Math.random() * 100 + "%";

    p.style.top =
        Math.random() * 100 + "%";

    p.style.setProperty(
        "--x",
        (Math.random() * 180 - 90) + "px"
    );

    p.style.setProperty(
        "--y",
        (Math.random() * 180 - 90) + "px"
    );

    p.style.animationDuration =
        (4 + Math.random() * 8) + "s";

    p.style.animationDelay =
        (Math.random() * 8) + "s";

    particles.appendChild(p);
}


/* =========================
   POBIERANIE WĄTKÓW
========================= */

async function loadThreads() {

    const container =
        document.getElementById("threads");

    try {

        const response =
            await fetch(API + "/api/threads");

        const threads =
            await response.json();

        if (!threads.length) {

            container.innerHTML = `
                <div class="empty">
                    BRAK WĄTKÓW<br><br>
                    <span style="color:#222">
                    cisza w próżni
                    </span>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        threads.forEach(thread => {

            const div =
                document.createElement("div");

            div.className = "thread";

            div.innerHTML = `
                <div class="thread-title">
                    #${thread.id}
                    ${escapeHTML(thread.title)}
                </div>

                <div class="thread-meta">
                    ${formatDate(thread.created_at)}
                </div>
            `;

            div.onclick = () =>
                openThread(thread.id);

            container.appendChild(div);

        });

    } catch (error) {

        container.innerHTML = `
            <div class="empty">
                BŁĄD POŁĄCZENIA Z NETIVLY API
            </div>
        `;

        console.error(error);
    }
}


/* =========================
   TWORZENIE WĄTKU
========================= */

function showCreate() {

    document.getElementById(
        "createBox"
    ).style.display = "block";

}

function hideCreate() {

    document.getElementById(
        "createBox"
    ).style.display = "none";

}


async function createThread() {

    const title =
        document.getElementById(
            "threadTitle"
        ).value.trim();

    const content =
        document.getElementById(
            "threadContent"
        ).value.trim();

    if (!title || !content) {

        alert(
            "Podaj temat i treść posta."
        );

        return;
    }

    try {

        const response =
            await fetch(
                API + "/api/thread",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        title: title
                    })
                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(
                result.error ||
                "Nie udało się utworzyć wątku."
            );

            return;
        }

        /* pierwszy post */

        await fetch(
            API + "/api/post",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    thread_id:
                        result.thread_id,

                    content: content
                })
            }
        );

        hideCreate();

        document.getElementById(
            "threadTitle"
        ).value = "";

        document.getElementById(
            "threadContent"
        ).value = "";

        loadThreads();

    } catch (error) {

        alert(
            "Nie można połączyć się z API."
        );

        console.error(error);
    }
}


/* =========================
   OTWIERANIE WĄTKU
========================= */

async function openThread(id) {

    try {

        const response =
            await fetch(
                API + "/api/thread/" + id
            );

        const data =
            await response.json();

        currentThread = id;

        document.getElementById(
            "home"
        ).style.display = "none";

        document.getElementById(
            "board"
        ).style.display = "block";

        const board =
            document.getElementById(
                "boardContent"
            );

        board.innerHTML = `
            <h2 style="
                color:#eee;
                font-weight:normal;
                margin-bottom:25px;
            ">
                #${data.thread.id}
                ${escapeHTML(
                    data.thread.title
                )}
            </h2>
        `;

        data.posts.forEach(post => {

            const div =
                document.createElement("div");

            div.className = "post";

            div.innerHTML = `
                <div class="post-head">
                    ANONIM
                    // #${post.id}
                    // ${formatDate(post.created_at)}
                </div>

                <div class="post-content">
                    ${escapeHTML(post.content)}
                </div>
            `;

            board.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        alert(
            "Nie udało się otworzyć wątku."
        );
    }
}


/* =========================
   ODPOWIEDŹ
========================= */

async function sendPost() {

    const textarea =
        document.getElementById(
            "replyContent"
        );

    const content =
        textarea.value.trim();

    if (!content) return;

    try {

        const response =
            await fetch(
                API + "/api/post",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        thread_id:
                            currentThread,

                        content: content
                    })
                }
            );

        const result =
            await response.json();

        if (!result.success) {

            alert(
                result.error ||
                "Błąd wysyłania."
            );

            return;
        }

        textarea.value = "";

        openThread(currentThread);

    } catch (error) {

        alert(
            "Błąd połączenia z API."
        );
    }
}


/* =========================
   POWRÓT
========================= */

function showHome() {

    currentThread = null;

    document.getElementById(
        "board"
    ).style.display = "none";

    document.getElementById(
        "home"
    ).style.display = "block";

    loadThreads();
}
    

/* =========================
   OCHRONA HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   START
========================= */

loadThreads();

//* Auto-odświeżanie co 15 sekund */
setInterval(() => {
    if (currentThread) {
        // Odświeżaj wątek tylko, jeśli użytkownik nie pisze odpowiedzi
        const replyBox = document.getElementById("replyContent");
        if (!replyBox || !replyBox.value.trim()) {
            openThread(currentThread);
        }
    } else {
        // Odświeżaj listę wątków tylko, jeśli okno tworzenia wątku jest zamknięte
        const createBox = document.getElementById("createBox");
        if (!createBox || createBox.style.display !== "block") {
            loadThreads();
        }
    }
}, 15000); // 15000 = 15 sekund
    
</script>

</body>
</html>
