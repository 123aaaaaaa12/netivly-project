<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>NETIVLY — Soon</title>

<style>
    :root {
        --bg: #050505;
        --text: #f5f5f5;
        --muted: #777;
        --line: rgba(255,255,255,.09);
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .035;
        background-image:
            linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(circle at center, black, transparent 80%);
    }

    .orb {
        position: fixed;
        width: 42vw;
        height: 42vw;
        min-width: 300px;
        min-height: 300px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.07), rgba(255,255,255,0) 68%);
        filter: blur(18px);
        animation: breathe 7s ease-in-out infinite;
        pointer-events: none;
    }

    .top {
        position: fixed;
        top: 30px;
        left: 34px;
        right: 34px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 2;
    }

    .brand {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .18em;
    }

    .year {
        color: #555;
        font-size: 10px;
        letter-spacing: .22em;
    }

    main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 30px;
    }

    .hero {
        width: min(100%, 980px);
        text-align: center;
        position: relative;
        z-index: 1;
        animation: enter 1.4s cubic-bezier(.2,.7,.2,1) both;
    }

    .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #777;
        font-size: 10px;
        letter-spacing: .22em;
        text-transform: uppercase;
        margin-bottom: 28px;
    }

    .eyebrow::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #d8d8d8;
        box-shadow: 0 0 14px rgba(255,255,255,.7);
        animation: pulse 2s ease-in-out infinite;
    }

    h1 {
        margin: 0;
        font-size: clamp(72px, 14vw, 190px);
        line-height: .78;
        letter-spacing: -.075em;
        font-weight: 650;
        text-wrap: balance;
    }

    .statement {
        margin: 42px auto 0;
        max-width: 520px;
        color: #888;
        font-size: clamp(14px, 1.6vw, 17px);
        line-height: 1.7;
        font-weight: 350;
    }

    .line {
        width: min(360px, 60vw);
        height: 1px;
        margin: 38px auto 0;
        background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .launch {
        margin-top: 24px;
        color: #444;
        font-size: 9px;
        letter-spacing: .28em;
        text-transform: uppercase;
    }

    .footer {
        position: fixed;
        bottom: 27px;
        left: 34px;
        right: 34px;
        display: flex;
        justify-content: space-between;
        color: #3e3e3e;
        font-size: 9px;
        letter-spacing: .16em;
        text-transform: uppercase;
        z-index: 2;
    }

    @keyframes enter {
        from { opacity: 0; transform: translateY(22px); filter: blur(8px); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes breathe {
        0%, 100% { opacity: .55; transform: translate(-50%, -50%) scale(.92); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes pulse {
        0%, 100% { opacity: .25; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.1); }
    }

    @media (max-width: 600px) {
        .top { top: 22px; left: 20px; right: 20px; }
        .footer { left: 20px; right: 20px; bottom: 20px; }
        .year { display: none; }
        main { padding: 20px; }
        h1 { font-size: clamp(64px, 22vw, 110px); }
        .statement { max-width: 330px; margin-top: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>
</head>

<body>
    <div class="orb"></div>

    <header class="top">
        <div class="brand">NETIVLY</div>
        <div class="year">2026 / 01</div>
    </header>

    <main>
        <section class="hero">
            <div class="eyebrow">A new space is forming</div>

            <h1>NETIVLY</h1>

            <p class="statement">
                Something new is taking shape.<br>
                A digital space for ideas, projects and things worth building.
            </p>

            <div class="line"></div>

            <div class="launch">Coming soon</div>
        </section>
    </main>

    <footer class="footer">
        <span>netivly.pl</span>
        <span>stay curious</span>
    </footer>
</body>
</html>
