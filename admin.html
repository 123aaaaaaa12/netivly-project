<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netivly // admin panel</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #71717a;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header-logo { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 5px; color: #ffffff; }
    .sub-logo { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 40px; text-transform: uppercase; }

    .admin-card {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .admin-card h2 { font-size: 1.25rem; margin-bottom: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
    }

    .btn { padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; border: none; transition: .2s; }
    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-secondary { background: #27272a; color: var(--text); }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-success { background: var(--success); color: #000; }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn:hover { opacity: 0.9; }

    .category-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      overflow-x: auto;
    }

    .tab-btn {
      background: #18181b;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { color: var(--text); background: #27272a; }
    .tab-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .thread-item { padding: 16px; background: #000; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; }
    .thread-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }

    .badge { text-transform: uppercase; font-size: 10px; padding: 2px 6px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; }
    .badge-pinned { background: #3a2e00; border: 1px solid #aa8800; color: #ffd700; font-weight: bold; }
    .badge-netivly { background: #0d2238; border: 1px solid #38a; color: #8cf; }
    .badge-private { background: #380d0d; border: 1px solid #833; color: #f88; }
    .badge-trash { background: #1a1a1a; border: 1px solid #555; color: #888; }
    .badge-main { background: #0d3810; border: 1px solid #383; color: #8f8; }

    .post-item {
      background: #09090b;
      border: 1px solid #18181b;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .post-content-view { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 8px; white-space: pre-wrap; }
    .edit-box { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding: 12px; background: #0a0a0c; border: 1px dashed var(--border); border-radius: 6px; }

    .post-img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 6px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header-logo">netivly</div>
  <div class="sub-logo">ADMIN PANEL // MODERACJA BAZY D1</div>

  <!-- FORMULARZ LOGOWANIA -->
  <div id="login-section" class="admin-card">
    <h2>Zaloguj się</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Login Admina</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Hasło Admina</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Zaloguj</button>
    </form>
  </div>

  <!-- SEKCJA PO ZALOGOWANIU -->
  <div id="dashboard-wrapper" class="hidden" style="width: 100%; max-width: 900px;">
    
    <!-- SEKCJA HURTOWEJ EDYCJI KATEGORII -->
    <div class="admin-card" style="border-color: var(--warning);">
      <h2 style="color: var(--warning);">⚡ Hurtowe przenoszenie wątków</h2>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <input type="text" id="bulk-ids-input" class="form-control" placeholder="Wpisz ID po przecinku np. 1, 4, 12" style="flex: 1; min-width: 200px;">
        <select id="bulk-category-select" class="form-control" style="width: auto;">
          <option value="netivly">Netivly</option>
          <option value="main">Main</option>
          <option value="trash">Trash (Kosz)</option>
          <option value="private">Private</option>
        </select>
        <button class="btn btn-warning" onclick="executeBulkMoveFromInput()">Przenieś wpisane ID</button>
        <button class="btn btn-success" onclick="executeBulkMoveFromCheckboxes()">Przenieś zaznaczone (<span id="selected-count">0</span>)</button>
      </div>
    </div>

    <!-- TWORZENIE NOWEGO WĄTKU (DLA ADMINA) -->
    <div class="admin-card">
      <h2>➕ Utwórz Oficjalny Wątek jako Admin</h2>
      <form id="create-thread-form">
        <div class="form-group">
          <label>Tytuł wątku</label>
          <input type="text" id="new-thread-title" class="form-control" placeholder="Wpisz tytuł..." required>
        </div>
        
        <div class="form-group">
          <label>Kategoria</label>
          <select id="new-thread-category" class="form-control" onchange="toggleNewPassInput()">
            <option value="netivly" selected>Netivly (Oficjalne ogłoszenia)</option>
            <option value="main">Main (Główna)</option>
            <option value="trash">Trash (Kosz)</option>
            <option value="private">Private (Chronione hasłem)</option>
          </select>
        </div>

        <div class="form-group hidden" id="new-pass-group">
          <label>Hasło (dla kategorii Private)</label>
          <input type="password" id="new-thread-password" class="form-control" placeholder="Wpisz hasło do wątku...">
        </div>

        <div class="form-group">
          <label>Treść pierwszego posta</label>
          <textarea id="new-thread-content" class="form-control" rows="4" placeholder="Napisz wiadomość..." required></textarea>
        </div>

        <button type="submit" class="btn btn-success" style="width: 100%; padding: 12px;">Opublikuj Wątek w D1</button>
      </form>
    </div>

    <!-- PANEL MODERACJI I LISTA WĄTKÓW -->
    <div class="admin-card">
      <h2>
        <span>Zarządzanie Wątkami i Postami</span>
        <button id="logout-btn" class="btn btn-danger">Wyloguj</button>
      </h2>

      <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 16px;">
        <button id="refresh-threads" class="btn btn-secondary">🔄 Odśwież Bazę D1</button>
      </div>

      <!-- PASEK ZAKŁADEK KATEGORII -->
      <div class="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('all', this)">Wszystkie (<span id="count-all">0</span>)</button>
        <button class="tab-btn" onclick="switchCategory('netivly', this)">🌐 Netivly (<span id="count-netivly">0</span>)</button>
        <button class="tab-btn" onclick="switchCategory('main', this)">💬 Main (<span id="count-main">0</span>)</button>
        <button class="tab-btn" onclick="switchCategory('private', this)">🔒 Private (<span id="count-private">0</span>)</button>
        <button class="tab-btn" onclick="switchCategory('trash', this)">🗑️ Trash (<span id="count-trash">0</span>)</button>
      </div>

      <div id="threads-list">Ładowanie danych...</div>
    </div>

  </div>

  <script>
    const API_URL = 'https://admin.cosielampisz7.workers.dev';

    const loginSection = document.getElementById('login-section');
    const dashboardWrapper = document.getElementById('dashboard-wrapper');
    const threadsList = document.getElementById('threads-list');

    let rawThreadsData = [];
    let currentCategoryFilter = 'all';

    if (localStorage.getItem('adminToken')) showDashboard();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch(`${API_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (res.ok && data.token) {
        localStorage.setItem('adminToken', data.token);
        showDashboard();
      } else {
        alert(data.error || 'Błąd logowania');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      location.reload();
    });

    function showDashboard() {
      loginSection.classList.add('hidden');
      dashboardWrapper.classList.remove('hidden');
      loadThreads();
    }

    function toggleNewPassInput() {
      const cat = document.getElementById('new-thread-category').value;
      const passGroup = document.getElementById('new-pass-group');
      if (cat === 'private') passGroup.classList.remove('hidden');
      else passGroup.classList.add('hidden');
    }

    document.getElementById('create-thread-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('new-thread-title').value.trim();
      const category = document.getElementById('new-thread-category').value;
      const password = document.getElementById('new-thread-password').value.trim();
      const content = document.getElementById('new-thread-content').value.trim();
      const token = localStorage.getItem('adminToken');

      try {
        const resThread = await fetch(`${API_URL}/api/thread`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, category, password })
        });
        const dataThread = await resThread.json();

        if (!dataThread.success) {
          alert('Błąd: ' + (dataThread.error || 'Nie udało się utworzyć wątku.'));
          return;
        }

        await fetch(`${API_URL}/api/post`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            thread_id: dataThread.thread_id,
            content: content
          })
        });

        alert('Wątek został dodany!');
        document.getElementById('create-thread-form').reset();
        toggleNewPassInput();
        loadThreads();

      } catch (err) {
        alert('Błąd połączenia z serwerem.');
      }
    });

    function switchCategory(cat, btn) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderThreads();
    }

    async function loadThreads() {
      threadsList.innerHTML = 'Ładowanie wątków...';
      try {
        const res = await fetch(`${API_URL}/api/threads`);
        let threads = await res.json();

        if (threads && threads.results && Array.isArray(threads.results)) {
          threads = threads.results;
        } else if (threads && threads.data && Array.isArray(threads.data)) {
          threads = threads.data;
        }

        rawThreadsData = Array.isArray(threads) ? threads : [];
        updateCategoryCounters(rawThreadsData);
        renderThreads();

      } catch (err) {
        threadsList.innerHTML = `<p style="color: var(--danger);">Błąd: ${err.message}</p>`;
      }
    }

    function updateCategoryCounters(threads) {
      document.getElementById('count-all').innerText = threads.length;
      document.getElementById('count-netivly').innerText = threads.filter(t => (t.category || 'main') === 'netivly').length;
      document.getElementById('count-main').innerText = threads.filter(t => (t.category || 'main') === 'main').length;
      document.getElementById('count-private').innerText = threads.filter(t => t.category === 'private').length;
      document.getElementById('count-trash').innerText = threads.filter(t => t.category === 'trash').length;
    }

    function renderThreads() {
      let filtered = rawThreadsData;

      if (currentCategoryFilter !== 'all') {
        filtered = rawThreadsData.filter(t => (t.category || 'main') === currentCategoryFilter);
      }

      if (filtered.length === 0) {
        threadsList.innerHTML = '<p style="color: var(--muted); padding: 10px 0;">Brak wątków w tej kategorii.</p>';
        return;
      }

      let html = '';
      for (const t of filtered) {
        const isPinned = t.is_pinned === 1;

        html += `
          <div class="thread-item" id="thread-box-${t.id}">
            <div class="thread-header">
              <div style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" class="thread-cb" value="${t.id}" onchange="updateSelectedCount()" style="width: 18px; height: 18px;">
                <strong style="font-size: 1.1rem;">
                  ${isPinned ? '<span class="badge badge-pinned">📌 Przypięty</span>' : ''}
                  <span class="badge badge-${t.category || 'main'}">${t.category || 'main'}</span>
                  #${t.id} <span id="thread-title-text-${t.id}">${t.title}</span>
                </strong>
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="loadAndShowPosts(${t.id})">📂 Pokaż Posty</button>
                <button class="btn ${isPinned ? 'btn-secondary' : 'btn-warning'}" onclick="togglePinThread(${t.id}, ${!isPinned})">
                  ${isPinned ? '📌 Odpinaj' : '📌 Przypnij'}
                </button>
                <button class="btn btn-warning" onclick="toggleEditThread(${t.id})">⚙️ Kategoria / Tytuł</button>
                <button class="btn btn-danger" onclick="deleteThread(${t.id})">Usuń Wątek</button>
              </div>
            </div>

            <div id="thread-edit-form-${t.id}" class="edit-box hidden">
              <div style="font-size: 0.8rem; color: var(--muted); font-weight: bold;">USTAWIENIA WĄTKU</div>
              <input type="text" id="thread-input-${t.id}" class="form-control" value="${t.title}">
              
              <select id="thread-cat-select-${t.id}" class="form-control" onchange="toggleAdminPasswordInput(${t.id})">
                <option value="netivly" ${t.category === 'netivly' ? 'selected' : ''}>Kategoria: Netivly (Oficjalny Admin)</option>
                <option value="main" ${t.category === 'main' ? 'selected' : ''}>Kategoria: Main (Główna)</option>
                <option value="trash" ${t.category === 'trash' ? 'selected' : ''}>Kategoria: Trash (Kosz)</option>
                <option value="private" ${t.category === 'private' ? 'selected' : ''}>Kategoria: Private (Prywatna)</option>
              </select>

              <input type="password" id="thread-pass-input-${t.id}" class="form-control ${t.category === 'private' ? '' : 'hidden'}" placeholder="Ustaw nowe hasło dla kategorii Private...">

              <div style="display: flex; gap: 6px; margin-top: 4px;">
                <button class="btn btn-success" onclick="saveThreadSettings(${t.id})">Zapisz Zmiany w D1</button>
                <button class="btn btn-secondary" onclick="autoCensorTitleInput(${t.id})">🪄 Cenzura RODO</button>
              </div>
            </div>

            <div id="posts-container-${t.id}" style="margin-top: 10px; padding-left: 10px; border-left: 2px solid var(--border);" class="hidden">
              <div style="font-size: 0.8rem; color: var(--muted);">Kliknij "Pokaż Posty", aby załadować zawartość.</div>
            </div>
          </div>
        `;
      }

      threadsList.innerHTML = html;
      updateSelectedCount();
    }

    async function loadAndShowPosts(threadId) {
      const container = document.getElementById(`posts-container-${threadId}`);
      if (!container.classList.contains('hidden')) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      container.innerHTML = '<div style="font-size: 0.8rem; color: var(--muted);">Pobieranie wpisów z D1...</div>';

      try {
        const res = await fetch(`${API_URL}/api/thread/${threadId}`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
        });
        const threadData = await res.json();
        const posts = threadData.posts || [];

        if (posts.length === 0) {
          container.innerHTML = '<div style="font-size: 0.8rem; color: var(--muted);">Brak postów w tym wątku.</div>';
          return;
        }

        container.innerHTML = posts.map(p => `
          <div class="post-item" id="post-box-${p.id}">
            <div class="post-content-view" id="post-text-${p.id}">${p.content}</div>
            ${p.image_url ? `<img src="${API_URL}${p.image_url}" class="post-img" alt="Załącznik">` : ''}
            <div style="display: flex; gap: 6px; margin-top: 8px;">
              <button class="btn btn-warning" onclick="toggleEditPost(${p.id})">✏️ Edytuj / Cenzuruj Post</button>
              <button class="btn btn-danger" onclick="deletePost(${p.id})">Usuń Post</button>
            </div>

            <div id="post-edit-form-${p.id}" class="edit-box hidden">
              <textarea id="post-input-${p.id}" class="form-control" rows="3">${p.content}</textarea>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-success" onclick="savePostContent(${p.id})">Zapisz Zmiany w D1</button>
                <button class="btn btn-secondary" onclick="autoCensorPostInput(${p.id})">🪄 Podpowiedź RODO</button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<div style="font-size: 0.8rem; color: var(--danger);">Błąd ładowania postów: ${err.message}</div>`;
      }
    }

    function updateSelectedCount() {
      const selected = document.querySelectorAll('.thread-cb:checked');
      document.getElementById('selected-count').innerText = selected.length;
    }

    async function sendBulkRequest(ids, category) {
      if (ids.length === 0) return alert('Brak wytypowanych ID wątków!');
      
      const res = await fetch(`${API_URL}/api/admin/threads/bulk-category`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        },
        body: JSON.stringify({ thread_ids: ids, target_category: category })
      });
      
      const data = await res.json();
      if (res.ok && data.success) {
        alert(data.message);
        loadThreads();
      } else alert('Błąd: ' + (data.error || 'Operacja nie powiodła się.'));
    }

    function executeBulkMoveFromInput() {
      const input = document.getElementById('bulk-ids-input').value;
      const ids = input.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
      const targetCat = document.getElementById('bulk-category-select').value;
      sendBulkRequest(ids, targetCat);
    }

    function executeBulkMoveFromCheckboxes() {
      const selected = document.querySelectorAll('.thread-cb:checked');
      const ids = Array.from(selected).map(cb => parseInt(cb.value));
      const targetCat = document.getElementById('bulk-category-select').value;
      sendBulkRequest(ids, targetCat);
    }

    document.getElementById('refresh-threads').addEventListener('click', loadThreads);

    function toggleEditPost(id) { document.getElementById(`post-edit-form-${id}`).classList.toggle('hidden'); }
    function toggleEditThread(id) { document.getElementById(`thread-edit-form-${id}`).classList.toggle('hidden'); }

    function toggleAdminPasswordInput(id) {
      const cat = document.getElementById(`thread-cat-select-${id}`).value;
      const passInput = document.getElementById(`thread-pass-input-${id}`);
      if (cat === 'private') passInput.classList.remove('hidden');
      else passInput.classList.add('hidden');
    }

    async function togglePinThread(id, shouldPin) {
      const res = await fetch(`${API_URL}/api/admin/thread/update`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        },
        body: JSON.stringify({ thread_id: id, is_pinned: shouldPin ? 1 : 0 })
      });
      if (res.ok) loadThreads();
      else alert('Nie udało się zmienić przypięcia.');
    }

    async function saveThreadSettings(id) {
      const newTitle = document.getElementById(`thread-input-${id}`).value;
      const targetCat = document.getElementById(`thread-cat-select-${id}`).value;
      const pass = document.getElementById(`thread-pass-input-${id}`).value;

      const updateRes = await fetch(`${API_URL}/api/admin/thread/update`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        },
        body: JSON.stringify({ thread_id: id, target_category: targetCat, password: pass })
      });

      const titleRes = await fetch(`${API_URL}/api/admin/thread/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        },
        body: JSON.stringify({ title: newTitle })
      });

      if (updateRes.ok && titleRes.ok) loadThreads();
      else alert('Błąd podczas zapisywania zmian.');
    }

    async function autoCensorPostInput(id) {
      const input = document.getElementById(`post-input-${id}`);
      const res = await fetch(`${API_URL}/api/admin/suggest-censor`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        },
        body: JSON.stringify({ text: input.value })
      });
      const data = await res.json();
      if (res.ok) input.value = data.suggestedText;
    }

    async function autoCensorTitleInput(id) {
      const input = document.getElementById(`thread-input-${id}`);
      const res = await fetch(`${API_URL}/api/admin/suggest-censor`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        },
        body: JSON.stringify({ text: input.value })
      });
      const data = await res.json();
      if (res.ok) input.value = data.suggestedText;
    }

    async function savePostContent(id) {
      const newContent = document.getElementById(`post-input-${id}`).value;
      const res = await fetch(`${API_URL}/api/admin/post/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        },
        body: JSON.stringify({ content: newContent })
      });

      if (res.ok) {
        document.getElementById(`post-text-${id}`).innerText = newContent;
        toggleEditPost(id);
      } else alert('Błąd zapisywania zmian.');
    }

    async function deletePost(id) {
      if (!confirm('Usunąć ten post?')) return;
      const res = await fetch(`${API_URL}/api/admin/post/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
      });
      if (res.ok) loadThreads();
    }

    async function deleteThread(id) {
      if (!confirm('Usunąć cały wątek wraz z postami?')) return;
      const res = await fetch(`${API_URL}/api/admin/thread/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
      });
      if (res.ok) loadThreads();
    }
  </script>
</body>
</html>
