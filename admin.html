<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administratora | Netivly Project</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Style główne projektu -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .admin-wrapper {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .admin-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 25px;
      backdrop-filter: blur(10px);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #0070f3;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .btn-primary {
      background: #0070f3;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #0051a8;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: #e53e3e;
      color: #fff;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .preview-box {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.6);
      border-left: 4px solid #0070f3;
      border-radius: 4px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- NAGŁÓWEK STRONY -->
  <header class="main-header">
    <div class="container header-container">
      <a href="index.html" class="logo">Net<span>ivly</span> Project</a>
      <div class="header-actions">
        <span class="badge-premium">Panel Admina</span>
      </div>
    </div>
  </header>

  <div class="admin-wrapper">

    <!-- 1. FORMULARZ LOGOWANIA -->
    <div id="login-section" class="admin-card">
      <h2><i class="fas fa-lock"></i> Logowanie do Panelu</h2>
      <p style="color: #a0aec0; margin-bottom: 20px;">Zaloguj się, aby zarządzać treściami serwisu Netivly.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="username">Login administratora</label>
          <input type="text" id="username" class="form-control" placeholder="Wpisz login" required>
        </div>
        <div class="form-group">
          <label for="password">Hasło</label>
          <input type="password" id="password" class="form-control" placeholder="Wpisz hasło" required>
        </div>
        <button type="submit" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Zaloguj się</button>
      </form>
    </div>

    <!-- 2. GŁÓWNY PANEL ZARZĄDZANIA (Widoczny po zalogowaniu) -->
    <div id="dashboard-section" class="hidden">
      
      <div class="admin-card">
        <div class="admin-header">
          <div>
            <h2 style="margin: 0;">Pulpit Nawigacyjny</h2>
            <small style="color: #a0aec0;">Zalogowano jako Administrator</small>
          </div>
          <button id="logout-btn" class="btn-danger"><i class="fas fa-sign-out-alt"></i> Wyloguj</button>
        </div>

        <h3>Dodaj nowy artykuł / treść</h3>
        <form id="article-form">
          <div class="form-group">
            <label for="art-title">Tytuł wpisu</label>
            <input type="text" id="art-title" class="form-control" placeholder="np. Suwerenność cyfrowa 2026" required>
          </div>

          <div class="form-group">
            <label for="art-category">Kategoria</label>
            <select id="art-category" class="form-control">
              <option value="artykul">Artykuł / Analiza</option>
              <option value="poradnik">Poradnik Techniczny</option>
              <option value="akademia">Akademia / Baza Wiedzy</option>
            </select>
          </div>

          <div class="form-group">
            <label for="art-content">Treść wpisu (Obsługuje Markdown / HTML)</label>
            <textarea id="art-content" class="form-control" rows="10" placeholder="Wpisz treść..." required></textarea>
          </div>

          <!-- Opcja Cenzury RODO -->
          <div class="form-group">
            <label class="checkbox-group">
              <input type="checkbox" id="auto-censor" checked>
              <span>Automatycznie cenzuruj dane osobowe (e-mail, tel, PESEL, IP)</span>
            </label>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="button" id="preview-btn" class="btn-secondary"><i class="fas fa-eye"></i> Podgląd cenzury</button>
            <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> Opublikuj wpis</button>
          </div>
        </form>

        <!-- Podgląd zcenzurowanego tekstu -->
        <div id="preview-box" class="preview-box hidden">
          <h4 style="margin-top: 0;"><i class="fas fa-user-shield"></i> Podgląd po cenzurze RODO:</h4>
          <pre id="preview-text" style="white-space: pre-wrap; font-family: inherit; color: #e2e8f0;"></pre>
        </div>
      </div>

    </div>

  </div>

  <script>
    // ADRES TWOJEGO API (Zmień na właściwy adres np. na Render / Railway / własny serwer)
    const API_URL = 'http://localhost:3000'; 

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const previewBox = document.getElementById('preview-box');

    // Sprawdzenie czy użytkownik ma zapisany token sesji
    const token = localStorage.getItem('adminToken');
    if (token) {
      showDashboard();
    }

    // Obsługa logowania
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('adminToken', data.token);
          showDashboard();
        } else {
          alert(data.error || 'Błąd logowania. Sprawdź dane.');
        }
      } catch (err) {
        alert('Błąd połączenia z serwerem API.');
      }
    });

    // Obsługa wylogowania
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      location.reload();
    });

    function showDashboard() {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
    }

    // Podgląd cenzury na żywo
    document.getElementById('preview-btn').addEventListener('click', async () => {
      const content = document.getElementById('art-content').value;
      if (!content) return alert('Wpisz najpierw treść artykułu!');

      try {
        const res = await fetch(`${API_URL}/api/censor-preview`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
          },
          body: JSON.stringify({ text: content })
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById('preview-text').innerText = data.censoredText;
          previewBox.classList.remove('hidden');
        } else {
          alert('Błąd podczas generowania podglądu.');
        }
      } catch (err) {
        alert('Błąd połączenia z API.');
      }
    });

    // Wysyłanie wpisu do API
    document.getElementById('article-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('art-title').value;
      const category = document.getElementById('art-category').value;
      const content = document.getElementById('art-content').value;
      const autoCensor = document.getElementById('auto-censor').checked;

      try {
        const res = await fetch(`${API_URL}/api/articles`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
          },
          body: JSON.stringify({ title, category, content, autoCensor })
        });

        if (res.ok) {
          alert('Wpis został pomyślnie dodany!');
          e.target.reset();
          previewBox.classList.add('hidden');
        } else {
          const data = await res.json();
          alert(data.error || 'Błąd podczas publikacji.');
        }
      } catch (err) {
        alert('Błąd połączenia z API.');
      }
    });
  </script>
</body>
</html>
