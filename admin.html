<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netivly // admin</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #71717a;
      --accent: #3b82f6;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header-logo {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 5px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .sub-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .admin-card {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .admin-card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-container input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
    }

    .btn-secondary {
      background: #27272a;
      color: var(--text);
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    .preview-box {
      margin-top: 15px;
      padding: 14px;
      background: #000000;
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #a1a1aa;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="header-logo">netivly</div>
  <div class="sub-logo">ADMIN PANEL // RODO MODERATION</div>

  <!-- 1. SEKCJA LOGOWANIA -->
  <div id="login-section" class="admin-card">
    <h2>Zaloguj się</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Login</label>
        <input type="text" id="username" class="form-control" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Hasło</label>
        <input type="password" id="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Zaloguj</button>
    </form>
  </div>

  <!-- 2. GŁÓWNY PANEL ZARZĄDZANIA -->
  <div id="dashboard-section" class="admin-card hidden">
    <h2>
      <span>Pulpit Moderatora</span>
      <button id="logout-btn" class="btn btn-danger">Wyloguj</button>
    </h2>

    <form id="article-form">
      <div class="form-group">
        <label for="art-title">Tytuł wpisu / wątku</label>
        <input type="text" id="art-title" class="form-control" placeholder="np. #27 Ogłoszenie administracyjne" required>
      </div>

      <div class="form-group">
        <label for="art-content">Treść wpisu</label>
        <textarea id="art-content" class="form-control" placeholder="Wpisz treść wiadomości..." required></textarea>
      </div>

      <div class="form-group">
        <label class="checkbox-container">
          <input type="checkbox" id="auto-censor" checked>
          <span>Automatycznie cenzuruj dane osobowe RODO (e-mail, telefon, PESEL, IP)</span>
        </label>
      </div>

      <div class="actions-row">
        <button type="button" id="preview-btn" class="btn btn-secondary">Podgląd cenzury</button>
        <button type="submit" class="btn btn-primary">Opublikuj jako Admin</button>
      </div>
    </form>

    <div id="preview-box" class="preview-box hidden">
      <strong style="color: var(--text);">[Podgląd RODO]:</strong><br>
      <span id="preview-text"></span>
    </div>
  </div>

  <script>
    // PODPIĘTY LINK DO TWOJEGO WORKERA
    const API_URL = 'https://admin.cosielampisz7.workers.dev';

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const previewBox = document.getElementById('preview-box');

    // Sprawdzanie istniejącej sesji
    const token = localStorage.getItem('adminToken');
    if (token) {
      showDashboard();
    }

    // Obsługa logowania
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('adminToken', data.token);
          showDashboard();
        } else {
          alert(data.error || 'Błąd logowania.');
        }
      } catch (err) {
        alert('Nie można połączyć się z serwerem API.');
      }
    });

    // Wylogowanie
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      location.reload();
    });

    function showDashboard() {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
    }

    // Podgląd Cenzury RODO
    document.getElementById('preview-btn').addEventListener('click', async () => {
      const content = document.getElementById('art-content').value;
      if (!content) return alert('Wpisz najpierw treść!');

      try {
        const res = await fetch(`${API_URL}/api/censor-preview`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
          },
          body: JSON.stringify({ text: content })
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById('preview-text').innerText = data.censoredText;
          previewBox.classList.remove('hidden');
        } else {
          alert('Błąd generowania podglądu.');
        }
      } catch (err) {
        alert('Błąd połączenia z API.');
      }
    });

    // Wysyłanie wpisu
    document.getElementById('article-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('art-title').value;
      const content = document.getElementById('art-content').value;
      const autoCensor = document.getElementById('auto-censor').checked;

      try {
        const res = await fetch(`${API_URL}/api/articles`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
          },
          body: JSON.stringify({ title, content, autoCensor })
        });

        if (res.ok) {
          alert('Wpis opublikowany!');
          e.target.reset();
          previewBox.classList.add('hidden');
        } else {
          const data = await res.json();
          alert(data.error || 'Błąd zapisu.');
        }
      } catch (err) {
        alert('Błąd połączenia z API.');
      }
    });
  </script>
</body>
</html>
