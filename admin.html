<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netivly // admin</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #71717a;
      --accent: #3b82f6;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header-logo {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .sub-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .admin-card {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .admin-card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
    }

    .btn-primary { background: var(--text); color: var(--bg); }
    .btn-secondary { background: #27272a; color: var(--text); }
    .btn-danger { background: var(--danger); color: #ffffff; }

    .thread-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header-logo">netivly</div>
  <div class="sub-logo">ADMIN PANEL // MODERATION D1</div>

  <!-- LOGOWANIE -->
  <div id="login-section" class="admin-card">
    <h2>Zaloguj się</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Login</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Hasło</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Zaloguj</button>
    </form>
  </div>

  <!-- PANEL MODERACJI -->
  <div id="dashboard-section" class="admin-card hidden">
    <h2>
      <span>Moderacja Wątków</span>
      <button id="logout-btn" class="btn btn-danger">Wyloguj</button>
    </h2>

    <div style="margin-bottom: 25px;">
      <button id="refresh-threads" class="btn btn-secondary" style="margin-bottom: 15px;">🔄 Odśwież listę wątków</button>
      <div id="threads-list">Ładowanie wątków z bazy D1...</div>
    </div>

    <hr style="border-color: var(--border); margin-bottom: 20px;">

    <h3>Stwórz nowy wątek (jako Admin)</h3>
    <form id="create-thread-form" style="margin-top: 15px;">
      <div class="form-group">
        <label>Tytuł wątku</label>
        <input type="text" id="thread-title" class="form-control" placeholder="Tytuł wątku..." required>
      </div>
      <button type="submit" class="btn btn-primary">Dodaj Wątek</button>
    </form>
  </div>

  <script>
    const API_URL = 'https://admin.cosielampisz7.workers.dev';

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const threadsList = document.getElementById('threads-list');

    if (localStorage.getItem('adminToken')) {
      showDashboard();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch(`${API_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      const data = await res.json();
      if (res.ok && data.token) {
        localStorage.setItem('adminToken', data.token);
        showDashboard();
      } else {
        alert(data.error || 'Błąd logowania');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      location.reload();
    });

    function showDashboard() {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
      loadThreads();
    }

    async function loadThreads() {
      threadsList.innerHTML = 'Ładowanie...';
      try {
        const res = await fetch(`${API_URL}/api/threads`);
        const threads = await res.json();

        if (threads.length === 0) {
          threadsList.innerHTML = '<p style="color: var(--muted);">Brak wątków w bazie.</p>';
          return;
        }

        threadsList.innerHTML = threads.map(t => `
          <div class="thread-item">
            <div>
              <strong>#${t.id} ${t.title}</strong>
              <div style="font-size: 0.75rem; color: var(--muted);">${new Date(t.created_at).toLocaleString()}</div>
            </div>
            <button class="btn btn-danger" onclick="deleteThread(${t.id})">Usuń</button>
          </div>
        `).join('');
      } catch (err) {
        threadsList.innerHTML = 'Błąd pobierania wątków.';
      }
    }

    document.getElementById('refresh-threads').addEventListener('click', loadThreads);

    async function deleteThread(id) {
      if (!confirm(`Czy na pewno chcesz usunąć wątek #${id} i wszystkie jego posty?`)) return;

      const res = await fetch(`${API_URL}/api/admin/thread/${id}`, {
        method: 'DELETE',
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
        }
      });

      if (res.ok) {
        loadThreads();
      } else {
        alert('Błąd podczas usuwania wątku.');
      }
    }

    document.getElementById('create-thread-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('thread-title').value;

      const res = await fetch(`${API_URL}/api/thread`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });

      if (res.ok) {
        document.getElementById('thread-title').value = '';
        loadThreads();
      } else {
        alert('Błąd tworzenia wątku.');
      }
    });
  </script>
</body>
</html>
